<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Finder</title>
    <meta name="description" content="Send WhatsApp messages without saving contacts. Quick, easy, and secure way to start WhatsApp conversations with any number.">
    <meta name="keywords" content="WhatsApp, quick message, send message without saving contact, WhatsApp web tool">
    <meta name="author" content="MelokMade Innovations">
    
    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="ohoL3yLD3EM6RJCcD61Kvj0KN8520Iuq0upq9x4s3hk" />
    
    <!-- Favicon -->
    <link rel="icon" href="./favicon.png" type="image/png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1D6YJ0RC8X"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-1D6YJ0RC8X');
    </script>
</head>
<body>
    <div class="layout">
        <div class="container">
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
                <i class="ph ph-moon"></i>
            </button>

            <div class="logo-container">
                <h1>WhatsApp<br>Quick Message</h1>
            </div>

            <div id="messageAlert" class="message" role="alert" aria-live="assertive"></div>

            <div class="input-group">
                <input type="text" 
                       id="countryCode" 
                       class="country-code" 
                       placeholder="+20" 
                       maxlength="4"
                       aria-label="Country code">
                <input type="text" 
                       id="phoneNumber" 
                       class="phone-number" 
                       placeholder="Enter phone number"
                       aria-label="Phone number">
            </div>
            <div class="error-text" id="phoneError" role="alert" aria-live="polite"></div>

            <div class="message-container">
                <textarea 
                    id="whatsappMessage" 
                    placeholder="Type a message (optional)" 
                    rows="2" 
                    aria-label="WhatsApp message (optional)"></textarea>
            </div>

            <button class="send-btn" onclick="openWhatsApp()" id="messageBtn">
                <i class="ph ph-paper-plane-right"></i>
                Open Chat
            </button>

            <footer>
                <p>Not official from WhatsApp Inc.
                <br>
                Made by <a href="https://msmelok.github.io/dev" target="_blank" rel="noopener">MelokMade Innovations</a>
                </p>
            </footer>
        </div>

        <div class="recent-numbers-container">
            <div class="recent-numbers-title">
                <div class="title-text">
                    <i class="ph ph-clock-clockwise"></i> Recent Numbers
                </div>
                <button class="clear-history" onclick="showConfirmation()" aria-label="Clear history">
                    <i class="ph ph-trash"></i> Clear
                </button>
            </div>

            <div class="confirmation-dialog" id="confirmationDialog">
                <i class="ph ph-warning-circle"></i>
                <span>Clear all history?</span>
                <div class="actions">
                    <button class="confirm-no" onclick="hideConfirmation()">No</button>
                    <button class="confirm-yes" onclick="clearHistory()">Yes</button>
                </div>
            </div>

            <div class="recent-numbers" id="recentNumbersList">
                <!-- Recent numbers will be populated here dynamically -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
